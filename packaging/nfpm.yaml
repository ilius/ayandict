name: ayandict
arch: amd64
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: Saeed Rasooli <saeed.gnu@gmail.com>
description: |
  AyanDict - A simple cross-platform desktop dictionary application
  based on Qt framework and written in Go that uses StarDict dictionary format.
homepage: https://github.com/ilius/ayandict
license: AGPL-3.0-or-later
depends:
  - libc6 (>= 2.34)
  - libqt6core6 | libqt6core6t64
  - libqt6gui6 | libqt6gui6t64
  - libqt6widgets6 | libqt6widgets6t64
  - libqt6network6 | libqt6network6t64
  - libqt6multimedia6 | libqt6multimedia6t64
  - libqt6multimediawidgets6 | libqt6multimediawidgets6t64
contents:
  - src: ayandict
    dst: /usr/bin/ayandict
    file_info:
      mode: 0755
  - src: ayandict-nogui
    dst: /usr/bin/ayandict-nogui
    file_info:
      mode: 0755
  - src: cmd/linux/scan-clipboard.sh
    dst: /usr/lib/ayandict/scan-clipboard.sh
    file_info:
      mode: 0755
  - src: cmd/linux/scan-selection.sh
    dst: /usr/lib/ayandict/scan-selection.sh
    file_info:
      mode: 0755
  - src: cmd/linux/status-icon-activate.sh
    dst: /usr/lib/ayandict/status-icon-activate.sh
    file_info:
      mode: 0755
  - src: packaging/ayandict.desktop
    dst: /usr/share/applications/ayandict.desktop
    file_info:
      mode: 0644
  - src: packaging/io.github.ilius.ayandict.metainfo.xml
    dst: /usr/share/metainfo/io.github.ilius.ayandict.metainfo.xml
    file_info:
      mode: 0644
  - src: pkg/resources/res/ayandict-64px.png
    dst: /usr/share/icons/hicolor/64x64/apps/ayandict.png
    file_info:
      mode: 0644
  - src: doc/config.rst
    dst: /usr/share/doc/ayandict/config.rst
    file_info:
      mode: 0644
  - src: doc/linux-scan-popup.md
    dst: /usr/share/doc/ayandict/linux-scan-popup.md
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/ayandict/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/ayandict/copyright
    file_info:
      mode: 0644