name: Mac Build with no GUI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.24

      - name: Build (no GUI)
        run: go build -v ./cmd/ayandict-nogui/

      - name: CLICK HERE TO DOWNLOAD BINARY
        uses: actions/upload-artifact@v7
        with:
          name: ayandict-nogui-mac-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ayandict-nogui
