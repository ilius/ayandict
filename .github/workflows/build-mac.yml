name: Mac Build (static)

on:
  push:
    branches: ["build-mac*"]
  pull_request:
    branches: ["v3"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Load macOS build config
        id: config
        run: ./ci/mac/export-config.py

      - name: Download Go build cache
        if: ${{ github.ref != 'refs/heads/release-macos' }}
        id: download-go-build-cache-mac
        uses: dawidd6/action-download-artifact@v23
        continue-on-error: true
        with:
          workflow_search: true
          workflow_conclusion: success
          event: push
          name: go-build-cache-mac
          path: ${{ steps.config.outputs.go-cache-root }}
          if_no_artifact_found: ignore
          use_unzip: true
          github_token: ${{ github.token }}
          check_artifacts: true
          search_artifacts: true

      - name: Check Go build cache
        run: ls -l "${{ steps.config.outputs.go-cache-root }}" || true

      - name: Show kernel info
        run: uname -a

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: ./ci/mac/install-dependencies.py

      # Caches the static Qt build to avoid recompiling every time
      - name: Cache static Qt6
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ steps.config.outputs.qt-prefix }}
          key: ${{ steps.config.outputs.qt-cache-key }}

      - name: Build Qt statically (if cache miss)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: ./ci/mac/build-qt.py

      - name: Normalize static Qt pkg-config libraries
        run: ./ci/mac/normalize-pkgconfig.py

      - name: Verify static Qt
        run: ./ci/mac/verify-qt.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.config.outputs.go-version }}

      - name: Read application version
        run: |
          version="$(go run pkg/version/version.go)"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not read a valid appinfo.VERSION: ${version}" >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "MAC_ARTIFACT=ayandict-${version}-mac-arm64" >> "${GITHUB_ENV}"

      - name: Build Go project (linking static Qt)
        run: |
          ./ci/mac/build-go.py
          mv ayandict "${MAC_ARTIFACT}"

      - name: Verify binary has no Homebrew dependencies
        run: ./ci/mac/verify-binary.py "${MAC_ARTIFACT}"

      - name: Compress binary with 7zip
        run: 7zz a "${MAC_ARTIFACT}.7z" "${MAC_ARTIFACT}"

      - name: Create macOS app bundle and DMG
        run: |
          dmg_root="$(mktemp -d "${RUNNER_TEMP}/ayandict-dmg.XXXXXX")"
          app_dir="${dmg_root}/AyanDict.app"
          plist="${app_dir}/Contents/Info.plist"
          version="${APP_VERSION#v}"
          short_version="${version%%[!0-9.]*}"
          if [[ ! "${short_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid macOS bundle version: ${version}" >&2
            exit 1
          fi

          mkdir -p "${app_dir}/Contents/MacOS"
          install -m 0755 \
            "${MAC_ARTIFACT}" \
            "${app_dir}/Contents/MacOS/${MAC_ARTIFACT}"

          plutil -create xml1 "${plist}"
          plutil -insert CFBundleDisplayName -string AyanDict "${plist}"
          plutil -insert CFBundleExecutable -string "${MAC_ARTIFACT}" "${plist}"
          plutil -insert CFBundleIdentifier -string io.github.ilius.ayandict "${plist}"
          plutil -insert CFBundleInfoDictionaryVersion -string 6.0 "${plist}"
          plutil -insert CFBundleName -string AyanDict "${plist}"
          plutil -insert CFBundlePackageType -string APPL "${plist}"
          plutil -insert CFBundleShortVersionString -string "${short_version}" "${plist}"
          plutil -insert CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "${plist}"
          plutil -insert NSHighResolutionCapable -bool true "${plist}"
          plutil -insert NSPrincipalClass -string NSApplication "${plist}"
          plutil -lint "${plist}"

          ln -s /Applications "${dmg_root}/Applications"

          install -m 0644 README.md "${dmg_root}/README.md"
          install -m 0644 CODE_OF_CONDUCT.md "${dmg_root}/CODE_OF_CONDUCT.md"
          mkdir -p "${dmg_root}/Docs"
          install -m 0644 doc/*.md "${dmg_root}/Docs/"
          mkdir -p "${dmg_root}/Scripts"
          install -m 0755 cmd/mac/*.sh "${dmg_root}/Scripts/"

          codesign --force --sign - "${app_dir}"
          codesign --verify --strict --verbose=2 "${app_dir}"

          hdiutil create \
            -volname AyanDict \
            -srcfolder "${dmg_root}" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "${GITHUB_WORKSPACE}/${MAC_ARTIFACT}.dmg"
          hdiutil verify "${GITHUB_WORKSPACE}/${MAC_ARTIFACT}.dmg"

      - name: CLICK HERE TO DOWNLOAD BINARY
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MAC_ARTIFACT }}
          if-no-files-found: error
          path: |
            ${{ env.MAC_ARTIFACT }}.7z
            ${{ env.MAC_ARTIFACT }}.dmg
          compression-level: 0

      - name: Upload Go build cache
        uses: actions/upload-artifact@v7
        with:
          name: go-build-cache-mac
          if-no-files-found: error
          path: ${{ steps.config.outputs.go-cache-root }}
