name: Go Test

on:
  push:
    branches: ["v3"]
  pull_request:
    branches: ["v3"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_PACKAGES: >-
        ./pkg/dictmgr/internal/dicts/
        ./pkg/headerlib/
        ./pkg/html/atom/
        ./pkg/ospaths/
        ./pkg/runewidth/
        ./pkg/slogcolor/
        ./pkg/webserver/
        ./pkg/wordwrap/
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Test
        run: |
          read -r -a packages <<< "$TEST_PACKAGES"
          CGO_ENABLED=1 go test -v "${packages[@]}"

      - name: Go vet
        run: |
          read -r -a packages <<< "$TEST_PACKAGES"
          CGO_ENABLED=1 go vet "${packages[@]}"
