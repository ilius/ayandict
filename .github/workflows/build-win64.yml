name: Windows Build

on:
  push:
    branches: ["build-windows"]
  pull_request:
    branches: ["v3"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip > $null

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install -q --upgrade aqtinstall

          Write-Host "Detecting latest Qt 6.x version..."
          $qtVer = (python -m aqt list-qt windows desktop --latest-version | Select-String '^6\.' | Select-Object -First 1).ToString().Trim()
          if (-not $qtVer) { Write-Error "Could not detect any Qt 6.x version in aqt output"; exit 1 }

          Write-Host "Installing Qt version $qtVer..."
          python -m aqt install-qt windows desktop $qtVer win64_msvc2022_64 --outputdir C:\Qt -m all

          # Find architecture folder (e.g. C:\Qt\6.10.0\msvc2022_64)
          $qtDir = Get-ChildItem C:\Qt -Directory | Where-Object { $_.Name -match '^6\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $qtArchDir = Join-Path $qtDir.FullName 'msvc2022_64'

          if (-not (Test-Path "$qtArchDir\lib")) {
            Write-Error "Qt installation failed — directory not created."
            exit 1
          }

          echo "QT6_DIR=$qtArchDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_CFLAGS=-I$qtArchDir\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_LDFLAGS=-L$qtArchDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Path=$qtArchDir\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Installed Qt to $qtArchDir"
          Write-Host "Added C headers and libs to CGO_* environment variables"

      - name: Install pkgconf (MSYS2)
        shell: pwsh
        run: |
          choco install -y msys2 > $null
          & "C:\tools\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm pkgconf > /dev/null"
          echo "PKG_CONFIG=C:\tools\msys64\usr\bin\pkgconf.exe" >> $env:GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      # - name: Build
      #   shell: pwsh
      #   env:
      #     CGO_ENABLED: 1
      #   run: |
      #     $env:PATH = "$env:QT6_DIR\bin;$env:PATH"
      #     $env:PKG_CONFIG_PATH = "$env:QT6_DIR\lib\pkgconfig"
      #     $env:PKG_CONFIG = "C:\tools\msys64\usr\bin\pkgconf.exe"
      #     go build -v -trimpath -ldflags "-s -w" .


      - name: Build Go app
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: |
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          Write-Host "QT6_DIR = $env:QT6_DIR"

          # Check that pkgconf can find Qt
          & pkgconf --modversion Qt6Widgets
          if ($LASTEXITCODE -ne 0) {
            Write-Error "pkgconf cannot find Qt6Widgets!"
            exit 1
          }

          go build -v ./cmd/ayandict


      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayandict-windows-amd64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ayandict.exe
