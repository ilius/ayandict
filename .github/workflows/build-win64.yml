name: Windows Build (Portable)

on:
  push:
    branches: ["build-windows"]
  pull_request:
    branches: ["v3"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      # Install Python + aqtinstall to fetch Qt binaries
      - name: Install aqtinstall
        run: pip install -q aqtinstall

      - name: Install Qt 6 (MSVC 2022)
        shell: pwsh
        run: |
          $QtRoot = "C:\Qt"
          $QtVersion = "6.10.0"
          $QtArch = "win64_msvc2022_64"

          # Install base Qt + tools (no module flags, 6.10 already includes them)
          python -m aqt install-qt windows desktop $QtVersion $QtArch --outputdir $QtRoot

          $qtDir = "$QtRoot\$QtVersion\$QtArch"
          if (-not (Test-Path $qtDir)) {
            Write-Error "❌ Qt install failed — $qtDir not found"
            exit 1
          }

          echo "QT6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_CFLAGS=-I$qtDir\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_LDFLAGS=-L$qtDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Path=$qtDir\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "✅ Installed Qt to $qtDir"

      # Install and configure Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      # Build the Go executable using miqt + Qt
      - name: Build Go binary
        shell: pwsh
        run: |
          go env -w CGO_ENABLED=1
          go build -v -o ayandict.exe ./cmd/ayandict
          if (-not (Test-Path "ayandict.exe")) {
            Write-Error "❌ Build failed — ayandict.exe not created"
            exit 1
          }
          Write-Host "✅ Build succeeded"

      # Bundle Qt DLLs and plugins using windeployqt
      - name: Bundle Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ayandict.exe dist/
          & "$env:QT6_DIR\bin\windeployqt.exe" dist\ayandict.exe --release
          Write-Host "✅ Qt DLLs bundled into dist/"

      # Compress the portable folder into a zip file
      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ayandict-win64.zip
          Write-Host "✅ Created ayandict-win64.zip"

      # Upload the zipped portable build as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayandict-win64-${{ github.sha }}
          path: ayandict-win64.zip
          retention-days: 7
