name: Windows Build (Portable)

on:
  push:
    branches: ["build-windows"]
  pull_request:
    branches: ["v3"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - uses: actions/checkout@v3

      - name: Install aqtinstall
        run: pip install -q aqtinstall

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set Go CGO env
        run: |
          echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
          echo "CC=cl.exe" >> $env:GITHUB_ENV
          echo "CXX=cl.exe" >> $env:GITHUB_ENV
          echo "CGO_CPPFLAGS=" >> $env:GITHUB_ENV

      - name: Install Qt 6 (MSVC 2022)
        shell: pwsh
        run: |
          $QtRoot = "C:\Qt"
          $QtVersion = "6.10.0"
          $QtArch = "win64_msvc2022_64"
          $QtDirName = "msvc2022_64"

          # Install base Qt + tools (no module flags, 6.10 already includes them)
          python -m aqt install-qt windows desktop $QtVersion $QtArch --outputdir $QtRoot

          $qtDir = "$QtRoot\$QtVersion\$QtDirName"
          if (-not (Test-Path $qtDir)) {
            ls "$QtRoot\$QtVersion"
            Write-Error "Qt install failed — $qtDir not found"
            exit 1
          }

          $ldflags = "-L$qtDir\lib Qt6Core.lib Qt6Gui.lib Qt6Widgets.lib Qt6Network.lib Qt6Multimedia.lib Qt6Svg.lib Qt6WinExtras.lib"


          echo "QT6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_CFLAGS=-I$qtDir\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CGO_LDFLAGS=$ldflags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          echo "Path=$qtDir\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Installed Qt to $qtDir"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      # Build the Go executable using miqt + Qt
      - name: Build Go binary
        shell: pwsh
        run: |
          go env
          . ".github\scripts\Measure-Memory.ps1"

          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory |
          ForEach-Object {
              [PSCustomObject]@{
                  Total_GB = "{0:N2}" -f ($_.TotalVisibleMemorySize / 1MB)
                  Free_GB  = "{0:N2}" -f ($_.FreePhysicalMemory / 1MB)
                  Used_GB  = "{0:N2}" -f (($_.TotalVisibleMemorySize - $_.FreePhysicalMemory) / 1MB)
              }
          }
          Measure-Memory go build -v -x
          if (-not (Test-Path "ayandict.exe")) {
            ls
            Write-Error "Build failed — ayandict.exe not created"
            exit 1
          }
          Write-Host "Build succeeded"

      # Bundle Qt DLLs and plugins using windeployqt
      - name: Bundle Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ayandict.exe dist/
          & "$env:QT6_DIR\bin\windeployqt.exe" dist\ayandict.exe --release
          Write-Host "Qt DLLs bundled into dist/"

      # Compress the portable folder into a zip file
      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ayandict-win64.zip
          Write-Host "Created ayandict-win64.zip"

      # Upload the zipped portable build as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayandict-win64-${{ github.sha }}
          path: ayandict-win64.zip
          retention-days: 7
